<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تشغيل مشرفين المعادي</title>
  <link rel="icon" type="image/png" href="./logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    .wrapper { position: relative; width: 100%; height: 100%; overflow: hidden; }
    iframe {
      position: absolute;
      top: -54px; /* لإخفاء بنر جوجل العلوي */
      left: 0;
      width: 100%;
      height: calc(100% + 54px);
      border: none;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <iframe src="https://script.google.com/macros/s/AKfycbxK_RdZuzkiQA3Wv4yB2m6lzHegIkM6xFd2Z1oHPkQlEtg3uaOeBxKeH8XnLeNaZyQ/exec" allow="clipboard-write; clipboard-read"></iframe>
  </div>
</body>
</html>
